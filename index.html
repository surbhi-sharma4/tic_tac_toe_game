<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Tic-Tac-Toe | Modern & Interactive Web Game</title>
  <meta name="description" content="A beautifully designed modern Tic-Tac-Toe web game featuring glowing neon aesthetics, responsive gameplay, Pass & Play or AI opponent, sound effects, and confetti celebrations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-cyan" aria-hidden="true"></div>
  <div class="ambient-glow glow-pink" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="game-header">
      <div class="logo-group">
        <div class="logo-icon" aria-hidden="true">
          <span class="x-mark">✕</span>
          <span class="o-mark">◯</span>
        </div>
        <div class="title-wrap">
          <h1 id="main-title">Tic-Tac-Toe</h1>
          <p class="subtitle">Classic strategy, reimagined with neon style</p>
        </div>
      </div>

      <!-- Controls: Sound & Theme/Help -->
      <div class="header-actions">
        <button id="sound-toggle-btn" class="icon-button" aria-label="Toggle Sound Effects" title="Sound: ON">
          <svg id="sound-icon-on" class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="sound-icon-off" class="btn-svg hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Game Section -->
    <main class="game-main">
      <!-- Mode Selection Tabs -->
      <nav class="mode-selector" aria-label="Game Mode Selection">
        <button id="mode-pvp-btn" class="mode-tab active" data-mode="pvp">
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>2 Players</span>
        </button>
        <button id="mode-ai-easy-btn" class="mode-tab" data-mode="ai-easy">
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8" y2="16"></line>
            <line x1="16" y1="16" x2="16" y2="16"></line>
          </svg>
          <span>vs AI (Casual)</span>
        </button>
        <button id="mode-ai-hard-btn" class="mode-tab" data-mode="ai-hard">
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
            <circle cx="9" cy="13" r="1.5"></circle>
            <circle cx="15" cy="13" r="1.5"></circle>
            <path d="M10 17h4"></path>
          </svg>
          <span>vs AI (Unbeatable)</span>
        </button>
      </nav>

      <!-- Scoreboard -->
      <section class="scoreboard" aria-label="Match Scores">
        <div id="player-x-card" class="score-card player-x active-glow">
          <div class="score-badge">X</div>
          <div class="score-info">
            <span class="score-name" id="name-x">Player 1</span>
            <span class="score-number" id="score-x">0</span>
          </div>
        </div>

        <div id="ties-card" class="score-card ties">
          <div class="score-badge">=</div>
          <div class="score-info">
            <span class="score-name">Ties</span>
            <span class="score-number" id="score-ties">0</span>
          </div>
        </div>

        <div id="player-o-card" class="score-card player-o">
          <div class="score-badge">O</div>
          <div class="score-info">
            <span class="score-name" id="name-o">Player 2</span>
            <span class="score-number" id="score-o">0</span>
          </div>
        </div>
      </section>

      <!-- Current Turn / Status Banner -->
      <div id="status-banner" class="status-banner" role="status" aria-live="polite">
        <div class="turn-indicator">
          <span class="turn-dot turn-dot-x" id="turn-dot"></span>
          <span id="turn-text"><strong class="highlight-x">X</strong>'s Turn</span>
        </div>
      </div>

      <!-- Game Board Container -->
      <section class="board-wrapper" aria-label="Tic-Tac-Toe Board">
        <div id="board" class="board" role="grid" aria-label="3x3 Tic Tac Toe Grid">
          <button id="cell-0" class="cell" data-index="0" role="gridcell" aria-label="Cell top-left"></button>
          <button id="cell-1" class="cell" data-index="1" role="gridcell" aria-label="Cell top-center"></button>
          <button id="cell-2" class="cell" data-index="2" role="gridcell" aria-label="Cell top-right"></button>
          <button id="cell-3" class="cell" data-index="3" role="gridcell" aria-label="Cell middle-left"></button>
          <button id="cell-4" class="cell" data-index="4" role="gridcell" aria-label="Cell middle-center"></button>
          <button id="cell-5" class="cell" data-index="5" role="gridcell" aria-label="Cell middle-right"></button>
          <button id="cell-6" class="cell" data-index="6" role="gridcell" aria-label="Cell bottom-left"></button>
          <button id="cell-7" class="cell" data-index="7" role="gridcell" aria-label="Cell bottom-center"></button>
          <button id="cell-8" class="cell" data-index="8" role="gridcell" aria-label="Cell bottom-right"></button>

          <!-- SVG Strike line when there's a winner -->
          <svg id="winning-strike-svg" class="strike-svg" viewBox="0 0 300 300" aria-hidden="true">
            <line id="strike-line" class="strike-line" x1="0" y1="0" x2="0" y2="0" />
          </svg>
        </div>
      </section>

      <!-- Quick Action Buttons -->
      <section class="action-buttons" aria-label="Game Actions">
        <button id="reset-round-btn" class="action-btn primary-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
          </svg>
          <span>Next Round</span>
        </button>
        <button id="reset-scores-btn" class="action-btn secondary-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
          <span>Reset Scores</span>
        </button>
      </section>
    </main>

    <!-- Footer -->
    <footer class="game-footer">
      <p>Crafted with ❤️ by <strong>Surbhi Sharma</strong> &bull; Press <kbd>R</kbd> to restart round</p>
    </footer>
  </div>

  <!-- Win / Draw Modal Overlay -->
  <div id="result-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-headline">
    <div class="modal-card">
      <div id="modal-badge" class="modal-badge-icon">🏆</div>
      <h2 id="modal-headline" class="modal-title">Player X Wins!</h2>
      <p id="modal-subtitle" class="modal-desc">Brilliant combination! Flawless victory.</p>
      
      <div class="modal-actions">
        <button id="modal-play-again-btn" class="modal-btn confirm-btn">Play Next Round</button>
        <button id="modal-close-btn" class="modal-btn cancel-btn">View Board</button>
      </div>
    </div>
  </div>

  <!-- Canvas for celebration confetti -->
  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
